---
core: LINTER

multiple_violations:
  sql: |
    SELECT a = NULL, 10 = b;
  violations:
    - GN024
    - GN027

suppress_all_violations:
  sql: |
    -- noqa
    SELECT a = NULL, 10 = b;
  violations: []

suppress_specific_violation:
  sql: |
    -- noqa: GN024
    SELECT a = NULL, 10 = b;
  violations:
    - GN027

fix_source_code:
  sql: |
    SELECT a = NULL;
    SELECT b IS NULL;
  violations:
    - GN024
  fixes: |
    SELECT a IS NULL;

    SELECT b IS NULL;
  config:
    lint:
      fix: true

partial_fix_source_code:
  sql: |
    SELECT a = NULL; SELECT 1;
  violations:
    - GN024
  fixes: |
    SELECT a IS NULL;

    SELECT 1;
  config:
    lint:
      fix: true

partial_fix_with_parse_error:
  sql: |
    SELECT a = NULL; SELECT * FROM;
  violations:
    - GN024
  errors:
    - syntax error at or near ";", at index 14
  fixes: |
    SELECT a IS NULL;

    SELECT * FROM;
  config:
    lint:
      fix: true

do_not_fix_source_code:
  sql: |
    SELECT a = NULL;

    SELECT b = NULL;
  violations:
    - GN024
    - GN024
  fixes: null

do_not_fix_suppressed_violation:
  sql: |
    -- noqa: GN024
    SELECT a = NULL;
  violations: []
  fixes: null
  config:
    lint:
      fix: true

parse_error:
  sql: |
    CREATE TABLE tbl (activated);
  errors:
    - syntax error at or near ";", at index 28

new_line_before_semicolon:
  sql: |
    SELECT a = NULL;
  violations:
    - GN024
  fixes: |
    SELECT a IS NULL
    ;
  config:
    lint:
      fix: true
    format:
      new_line_before_semicolon: true

fix_enablement:
  sql: |
    SELECT a = NULL;
  expected_violation_count: 1
  violations:
    - GN024
  fixes: |
    SELECT a IS NULL;
  config:
    lint:
      fix: true
      fixable:
        - GN024
