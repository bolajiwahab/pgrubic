---
core: FORMATTER

parse_error:
  sql: |
    SELECT * FROM;
  formatted: |
    SELECT * FROM;
  errors:
    - syntax error at or near ";", at index 13

new_line_before_semicolon:
  sql: |
    select 1;
  formatted: |
    SELECT 1
    ;
  config:
    format:
      new_line_before_semicolon: true

lowercase_keywords_preserve_other_tokens:
  sql: |
    SELECT Foo AS "FROM", 'WHERE' FROM Café -- JOIN
    WHERE Foo::TEXT IS NOT NULL and name ILIKE '%postgres%';
  formatted: |
    -- JOIN
    select foo as "FROM"
         , 'WHERE'
      from "café"
     where cast(foo as text) is not null
       and name ilike '%postgres%';
  config:
    format:
      uppercase_keywords: false
