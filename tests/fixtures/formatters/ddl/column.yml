---
# yamllint disable rule:line-length
formatter: COLUMN

create_table_with_column:
  sql: |
    CREATE TABLE orders (
      order_id bigint,
      order_date date
    );
  expected: |
    CREATE TABLE orders (
        order_id bigint
      , order_date date
    );

create_foreign_table_with_column:
  sql: |
    CREATE FOREIGN TABLE orders (
      id text STORAGE EXTERNAL COMPRESSION LZ4 OPTIONS (column_name 'id') COLLATE "default",
      name text
    )
    SERVER mood_server
    OPTIONS (
        schema_name 'some_schema'
      , table_name 'some_table'
    );
  expected: |
    CREATE FOREIGN TABLE orders (
        id text STORAGE external COMPRESSION lz4 OPTIONS (column_name 'id') COLLATE "default"
      , name text
    )
    SERVER mood_server
    OPTIONS (
        schema_name 'some_schema'
      , table_name 'some_table'
    );

create_table_of_type_with_column:
  sql: |
    CREATE TABLE employees OF employee_type (
        salary WITH OPTIONS DEFAULT 1000
    );
  expected: |
    CREATE TABLE employees OF employee_type (
        salary WITH OPTIONS DEFAULT 1000
    );

add_column:
  sql: |
    ALTER TABLE orders
    ADD COLUMN test_column text;
  expected: |
    ALTER TABLE orders
        ADD COLUMN test_column text;

drop_column:
  sql: |
    ALTER TABLE orders
    DROP COLUMN test_column;
  expected: |
    ALTER TABLE orders
        DROP COLUMN test_column;

rename_column:
  sql: |
    ALTER TABLE orders
    RENAME COLUMN test_column TO new_test_column;
  expected: |
    ALTER TABLE orders
        RENAME COLUMN test_column TO new_test_column;

alter_column:
  sql: |
    ALTER TABLE orders
    ALTER COLUMN test_column SET NOT NULL;
  expected: |
    ALTER TABLE orders
        ALTER COLUMN test_column SET NOT NULL;

alter_column_type:
  sql: |
    ALTER TABLE orders
    ALTER COLUMN test_column TYPE text;
  expected: |
    ALTER TABLE orders
        ALTER COLUMN test_column TYPE text;

alter_column_default:
  sql: |
    ALTER TABLE orders
    ALTER COLUMN test_column SET DEFAULT 'a';
  expected: |
    ALTER TABLE orders
        ALTER COLUMN test_column SET DEFAULT 'a';
