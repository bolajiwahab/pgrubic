---
# yamllint disable rule:line-length
formatter: FUNCTION

create_sql_conforming_style_function:
  sql: |
    CREATE FUNCTION add(a integer, b integer) RETURNS integer
    LANGUAGE SQL
    IMMUTABLE
    RETURNS NULL ON NULL INPUT
    VOLATILE PARALLEL SAFE NOT LEAKPROOF
    SECURITY DEFINER
    COST 100
    SET search_path = 'admin', 'pg_temp'
    RETURN a + b;
  expected: |
    CREATE FUNCTION add (
        a integer
      , b integer
    )
    RETURNS integer
    LANGUAGE SQL
    IMMUTABLE
    RETURNS NULL ON NULL INPUT
    VOLATILE
    PARALLEL SAFE
    NOT LEAKPROOF
    SECURITY DEFINER
    COST 100
    SET search_path TO 'admin', 'pg_temp'
    RETURN a + b;

create_sql_conforming_style_function_block_body:
  sql: |
    CREATE FUNCTION insert_data(a integer, b integer) RETURNS void
    LANGUAGE SQL
    BEGIN ATOMIC
      INSERT INTO tbl VALUES (a);
      INSERT INTO tbl VALUES (b);
    END;
  expected: |
    CREATE FUNCTION insert_data (
        a integer
      , b integer
    )
    RETURNS void
    LANGUAGE SQL
    BEGIN ATOMIC
        INSERT INTO tbl
        VALUES (a);

        INSERT INTO tbl
        VALUES (b);
    END;

create_plpgsql_do_block:
  sql: |
    DO $$
        BEGIN
            -- body comment
            PERFORM 1;
        END
    $$;
  expected: |
    DO $BODY$
        BEGIN
            -- body comment
            PERFORM 1;
        END
    $BODY$;

create_plpgsql_do_block_with_language:
  sql: |
    DO $$
        BEGIN
            -- body comment
            PERFORM 1;
        END
    $$ LANGUAGE plpgsql;
  expected: |
    DO LANGUAGE plpgsql $BODY$
        BEGIN
            -- body comment
            PERFORM 1;
        END
    $BODY$;

create_sql_function_with_as:
  skip_semantic_check: Function options are reordered and the SQL body is formatted.
  sql: |
    CREATE FUNCTION add(integer, integer) RETURNS integer
    AS 'select $1 + $2, $1 - $2, $1 * $2 from tbl'
    LANGUAGE SQL
    IMMUTABLE
    SECURITY INVOKER
    RETURNS NULL ON NULL INPUT;
  expected: |
    CREATE FUNCTION add (
        integer
      , integer
    )
    RETURNS integer
    LANGUAGE SQL
    IMMUTABLE
    SECURITY INVOKER
    RETURNS NULL ON NULL INPUT
    AS $BODY$
        SELECT $1 + $2
             , $1 - $2
             , $1 * $2
          FROM tbl;
    $BODY$;

create_sql_function_body_with_config:
  skip_semantic_check: Function options are reordered and the SQL body is formatted.
  sql: |
    CREATE FUNCTION add(integer, integer) RETURNS integer
    AS 'SELECT $1 + $2'
    LANGUAGE SQL;
  config:
    format:
      uppercase_keywords: false
  expected: |
    create function add (
        integer
      , integer
    )
    returns integer
    language sql
    as $BODY$
        select $1 + $2;
    $BODY$;

create_plpgsql_conforming_style_function:
  sql: |
    CREATE FUNCTION add(a integer, b integer) RETURNS integer
    LANGUAGE plpgSQL
    IMMUTABLE
    STRICT
    RETURN a + b;
  expected: |
    CREATE FUNCTION add (
        a integer
      , b integer
    )
    RETURNS integer
    LANGUAGE plpgsql
    IMMUTABLE
    RETURNS NULL ON NULL INPUT
    RETURN a + b;

# we do not format non-sql function bodies
create_plpgsql_function_with_as:
  skip_semantic_check: Function options are reordered and the quoted body is rewritten.
  sql: |
    CREATE OR REPLACE FUNCTION increment(i integer) RETURNS integer AS $$
        BEGIN
            RETURN i + 1;
        END;
    $$ LANGUAGE plpgsql;
  expected: |
    CREATE OR REPLACE FUNCTION increment (
        i integer
    )
    RETURNS integer
    LANGUAGE plpgsql
    AS $BODY$
        BEGIN
            RETURN i + 1;
        END;
    $BODY$;

# we do not format non-sql function bodies
create_plpgsql_function_return_table:
  skip_semantic_check: Function options are reordered and the quoted body is rewritten.
  sql: |
    create or replace function get_demo_data(p_id varchar,p_start_date timestamp,p_end_date timestamp)
    returns table(record_id bigint,record_date timestamp,amount numeric,code text)
    as $_$
    begin
    return query select t.id,t.created_at,t.amount,t.code from test_table t where t.user_id=p_id
    and t.created_at between p_start_date and p_end_date;
    end;
    $_$
    language plpgsql;
  expected: |
    CREATE OR REPLACE FUNCTION get_demo_data (
        p_id varchar
      , p_start_date timestamp
      , p_end_date timestamp
    )
    RETURNS TABLE (
        record_id bigint
      , record_date timestamp
      , amount numeric
      , code text
    )
    LANGUAGE plpgsql
    AS $BODY$
    begin
    return query select t.id,t.created_at,t.amount,t.code from test_table t where t.user_id=p_id
    and t.created_at between p_start_date and p_end_date;
    end;
    $BODY$;

create_function_plpgsql_returns_set_of:
  skip_semantic_check: Function options are reordered and the quoted body is rewritten.
  sql: |
    create or replace function find_film_by_id(
      p_id int
    )
    returns setof film
    as
    $$
    begin
      return query select * from film
      where film_id = p_id;
    end;
    $$
    language plpgsql;
  expected: |
    CREATE OR REPLACE FUNCTION find_film_by_id (
        p_id integer
    )
    RETURNS SETOF film
    LANGUAGE plpgsql
    AS $BODY$
    begin
      return query select * from film
      where film_id = p_id;
    end;
    $BODY$;

create_function_no_parameters:
  skip_semantic_check: Function options are reordered and the quoted body is rewritten.
  sql: |
    create or replace function find_film_by_id()
    returns setof film
    as
    $$
    begin
      return query select * from film;
    end;
    $$
    language plpgsql;
  expected: |
    CREATE OR REPLACE FUNCTION find_film_by_id ()
    RETURNS SETOF film
    LANGUAGE plpgsql
    AS $BODY$
    begin
      return query select * from film;
    end;
    $BODY$;

create_sql_conforming_style_procedure_block_body:
  sql: |
    CREATE PROCEDURE insert_data(a integer, b integer)
    LANGUAGE SQL
    BEGIN ATOMIC
      INSERT INTO tbl VALUES (a);
      INSERT INTO tbl VALUES (b);
    END;
  expected: |
    CREATE PROCEDURE insert_data (
        a integer
      , b integer
    )
    LANGUAGE SQL
    BEGIN ATOMIC
        INSERT INTO tbl
        VALUES (a);

        INSERT INTO tbl
        VALUES (b);
    END;

create_sql_procedure_body_with_config:
  sql: |
    CREATE PROCEDURE insert_data(a integer, b integer)
    LANGUAGE SQL
    BEGIN ATOMIC
      INSERT INTO tbl VALUES (a);
      INSERT INTO tbl VALUES (b);
    END;
  config:
    format:
      new_line_before_semicolon: true
      lines_between_statements: 0
  expected: |
    CREATE PROCEDURE insert_data (
        a integer
      , b integer
    )
    LANGUAGE SQL
    BEGIN ATOMIC
        INSERT INTO tbl
        VALUES (a)
    ;
        INSERT INTO tbl
        VALUES (b)
    ;
    END
    ;

create_sql_non_conforming_style_procedure:
  skip_semantic_check: Procedure options are reordered and the SQL body is formatted.
  sql: |
    CREATE PROCEDURE insert_data(a integer, b integer)
    LANGUAGE SQL
    AS $$
    INSERT INTO tbl VALUES (a);
    INSERT INTO tbl VALUES (b);
    $$;
  expected: |
    CREATE PROCEDURE insert_data (
        a integer
      , b integer
    )
    LANGUAGE SQL
    AS $BODY$
        INSERT INTO tbl
        VALUES (a);

        INSERT INTO tbl
        VALUES (b);
    $BODY$;

create_c_function:
  skip_semantic_check: Function options are intentionally reordered.
  sql: |
    CREATE FUNCTION pg_stat_statements(IN showtext boolean,
        OUT userid oid
    )
    RETURNS SETOF record
    AS 'MODULE_PATHNAME', 'pg_stat_statements_1_3'
    LANGUAGE C WINDOW STABLE;
  expected: |
    CREATE FUNCTION pg_stat_statements (
        IN showtext boolean
      , OUT userid oid
    )
    RETURNS SETOF record
    LANGUAGE C
    WINDOW
    STABLE
    AS 'MODULE_PATHNAME', 'pg_stat_statements_1_3';

alter_function:
  sql: |
    ALTER FUNCTION check_password(text, text) SET search_path = admin, pg_temp reset all SET search_path = admin, pg_temp;
  expected: |
    ALTER FUNCTION check_password (text, text)
        SET search_path TO 'admin', 'pg_temp'
        RESET ALL
        SET search_path TO 'admin', 'pg_temp';

alter_procedure:
  sql: |
    ALTER PROCEDURE insert_data(a integer, b integer) SET search_path = admin, pg_temp reset all SET search_path = admin, pg_temp;
  expected: |
    ALTER PROCEDURE insert_data (a integer, b integer)
        SET search_path TO 'admin', 'pg_temp'
        RESET ALL
        SET search_path TO 'admin', 'pg_temp';

create_function_with_body_delimiter_in_body:
  skip_semantic_check: Function options are reordered and the SQL body is formatted.
  sql: |
    CREATE FUNCTION body_text() RETURNS text LANGUAGE sql
    AS $function$ SELECT '$BODY$' $function$;
  expected: |
    CREATE FUNCTION body_text ()
    RETURNS text
    LANGUAGE SQL
    AS $BODY_1$
        SELECT '$BODY$';
    $BODY_1$;

alter_routine:
  sql: |
    ALTER ROUTINE insert_data(integer, integer) SET search_path = admin;
  expected: |
    ALTER ROUTINE insert_data (integer, integer)
        SET search_path TO 'admin';
