---
rule: ST002

test_fail_no_procedural_language_allowed_by_default:
  sql_fail: |
    CREATE LANGUAGE plsample HANDLER plsample_call_handler;

test_fail_procedural_language_not_in_allowed_list:
  sql_fail: |
    CREATE LANGUAGE plsample HANDLER plsample_call_handler;
  config:
    lint:
      allowed_languages:
        - plpgsql

test_pass_procedural_language_in_allowed_list:
  sql_pass: |
    CREATE LANGUAGE plsample HANDLER plsample_call_handler;
  config:
    lint:
      allowed_languages:
        - plsample
