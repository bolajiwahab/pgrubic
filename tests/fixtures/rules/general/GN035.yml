---
rule: GN035

test_pass_function_without_options:
  sql_pass: |
    CREATE FUNCTION f() RETURNS void;

test_pass_function_ambiguous_bodies:
  sql_pass: |
    CREATE OR REPLACE FUNCTION public.func() RETURNS integer
    AS $$ BEGIN RETURN 1; END; $$ LANGUAGE plpgsql RETURN 1;

test_pass_procedure_ambiguous_bodies:
  sql_pass: |
    CREATE PROCEDURE p() LANGUAGE plpgsql
    AS $$ BEGIN NULL; END; $$ BEGIN ATOMIC SELECT 1; END;

test_fail_inline_sql_function_body_wrong_language:
  sql_fail: |
    CREATE OR REPLACE FUNCTION public.add1 (integer, integer) RETURNS integer
    LANGUAGE plpgsql
    IMMUTABLE
    RETURNS NULL ON NULL INPUT
    RETURN 'select $1 + $2;';
  sql_fix: |
    CREATE OR REPLACE FUNCTION public.add1 (
        integer
      , integer
    )
    RETURNS integer
    LANGUAGE SQL
    IMMUTABLE
    RETURNS NULL ON NULL INPUT
    RETURN 'select $1 + $2;';
test_pass_inline_sql_function_body_language_sql:
  sql_pass: |
    CREATE OR REPLACE FUNCTION public.add1 (integer, integer) RETURNS integer
    LANGUAGE sql
    IMMUTABLE
    RETURNS NULL ON NULL INPUT
    RETURN 'select $1 + $2;';

test_pass_inline_sql_function_body_default_language_sql:
  sql_pass: |
    CREATE OR REPLACE FUNCTION public.add1 (integer, integer) RETURNS integer
    IMMUTABLE
    RETURNS NULL ON NULL INPUT
    RETURN 'select $1 + $2;';
