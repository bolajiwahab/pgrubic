---
name: "PR and Issue Labeler"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

  issues:
    types:
      - opened
      - edited
      - reopened

# Each job should declare the permissions it needs.
permissions: {}

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # Labels issues.
      pull-requests: write  # Labels pull requests.
    steps:
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67  # v3.5
        with:
          configuration-path: .github/labeler.yml
          include-title: 1
          include-body: 0
          enable-versioned-regex: 0
          sync-labels: 1
          repo-token: ${{ github.token }}
