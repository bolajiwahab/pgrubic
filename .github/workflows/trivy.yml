---
# yamllint disable rule:line-length
name: Trivy Security Scan

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  trivy-repo-scan:
    name: Trivy Repository Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: os,library
          skip-dirs: .git,.venv,.tox
          format: sarif
          output: trivy-repo-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          limit-severities-for-sarif: "true"
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Upload repository findings to Code Scanning
        if: always() && hashFiles('trivy-repo-results.sarif') != ''
        # Retain the report below when Code Scanning is unavailable.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          sarif_file: trivy-repo-results.sarif
          category: trivy-repo

      - name: Retain repository SARIF report
        if: always() && hashFiles('trivy-repo-results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: trivy-repo-results
          path: trivy-repo-results.sarif
          retention-days: 14

  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build production image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: pgrubic:scan
          cache-from: |
            type=gha,scope=trivy-image
            type=gha
          cache-to: type=gha,scope=trivy-image,mode=max

      - name: Scan production image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: pgrubic:scan
          scanners: vuln
          vuln-type: os,library
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          limit-severities-for-sarif: "true"
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Upload image findings to Code Scanning
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        # Retain the report below when Code Scanning is unavailable.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Retain image SARIF report
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: trivy-image-results
          path: trivy-image-results.sarif
          retention-days: 14
