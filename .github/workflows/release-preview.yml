---
name: Release preview

on:
  workflow_dispatch:

# Each job should declare the permissions it needs.
permissions: {}

jobs:
  preview:
    name: Preview the next release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # commitizen reads every commit and tag since the last release.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: 0.13.9

      - name: Preview the next release
        run: |
          tools/release_preview.sh > preview.txt
          cat preview.txt
          {
            echo '```'
            cat preview.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
