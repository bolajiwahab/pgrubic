---
# yamllint disable rule:line-length
name: Post coverage comment

# workflow_run lets this workflow comment on pull requests from forks. It never checks
# out or runs pull request code; it only posts the comment CI stored as an artifact.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

# Each job should declare the permissions it needs.
permissions: {}

jobs:
  test:
    name: Run tests & display coverage
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      # Gives the action the necessary permissions for publishing new
      # comments in pull requests.
      pull-requests: write
      # Gives the action the necessary permissions for editing existing
      # comments (to avoid publishing multiple comments in the same PR)
      contents: write
      # Gives the action the necessary permissions for looking up the
      # workflow that launched this workflow, and download the related
      # artifact that contains the comment to be published
      actions: read
    steps:
      - name: Post comment
        uses: py-cov-action/python-coverage-comment-action@281cb0dcb5b15d4773037d51873558fddc5a7df8  # v4.7
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
