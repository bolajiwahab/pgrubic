---
# yamllint disable rule:line-length
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DEFAULT_PYTHON_VERSION: 3.12

jobs:
  tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy: &python-matrix
      fail-fast: false
      matrix:
        python-version:
          - 3.12
          - 3.13
          - 3.14
    steps:
      - run: echo "Using python version ${{ matrix.python-version }}"

  checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - lint
          - lock
          - docstrings-coverage
          - isort
          - format
          - typing
          - security
          - docbuild
          - ensure-docs-up-to-date
          - build-dist
          - pre-commit
    name: ${{ matrix.job }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version: 0.12.5

      - name: Install tox
        run: uv tool install tox==4.56.1 --with tox-uv-bare==1.36.0

      - name: Run ${{ matrix.job }}
        run: tox -e ${{ matrix.job }}

  tests-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    strategy: *python-matrix
    name: tests-windows-python-${{ matrix.python-version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version: 0.12.5

      - name: Install tox
        run: uv tool install tox==4.56.1 --with tox-uv-bare==1.36.0

      - name: Run tests
        run: tox -e tests-windows

  tests-linux:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy: *python-matrix
    name: tests-linux-python-${{ matrix.python-version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version: 0.12.5
      - name: Install tox
        run: uv tool install tox==4.56.1 --with tox-uv-bare==1.36.0
      - name: Run tests
        run: tox -e tests-linux

  tests-macos:
    permissions:
      contents: read
    runs-on: macos-latest
    strategy: *python-matrix
    name: tests-macos-python-${{ matrix.python-version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version: 0.12.5
      - name: Install tox
        run: uv tool install tox==4.56.1 --with tox-uv-bare==1.36.0
      - name: Run tests
        run: tox -e tests-macos

  build-docker-image:
    name: Build multi-platform docker image [arch=amd64,arm64]
    env:
      image_tag: ${{ github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU for ARM
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:${{ env.image_tag }}

  coverage:
    runs-on: ubuntu-latest
    permissions:
      # Gives the action the necessary permissions for publishing new
      # comments in pull requests.
      pull-requests: write
      # Gives the action the necessary permissions for pushing data to the
      # python-coverage-comment-action branch, and for editing existing
      # comments (to avoid publishing multiple comments in the same PR)
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version: 0.12.5

      - name: Install tox
        run: uv tool install tox==4.56.1 --with tox-uv-bare==1.36.0

      - name: Run coverage
        run: tox -e coverage

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4  # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_FILES_IN_COMMENT: 120

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
