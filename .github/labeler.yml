---
# Type labels match the conventional commit type at the start of a pull request
# title, such as "feat:" or "fix(deps):". The release notes are grouped by them.
chore:
  - '/^chore(\(.+\))?:/'

rule:
  - "/(rule)/i"

formatter:
  - "/(formatter|printer)/i"

documentation:
  - '/^docs?(\(.+\))?:/'

bug:
  - '/^(fix(\(.+\))?:|\[Bug\])/'

config:
  - "/(config)/i"

enhancement:
  - '/^(feat(\(.+\))?!?:|\[Feature\])/'

ci:
  - '/^(ci|build)(\(.+\))?:/'

# The deps or dependencies scope, such as "fix(deps):" or "chore(dependencies):"
dependencies:
  - '/^\w+\((deps|dependencies)\):/'

# A "!" after feat, such as "feat!:" or "feat(linter)!:"
breaking-change:
  - '/^feat(\(.+\))?!:/'

question:
  - "/(question)/i"

help-wanted:
  - "/(help)/i"

security:
  - "/(security)/i"
