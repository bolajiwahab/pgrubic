---
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait for a release to settle before proposing it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait for a release to settle before proposing it.
    cooldown:
      default-days: 7
    groups:
      python-packages:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait for a release to settle before proposing it.
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
